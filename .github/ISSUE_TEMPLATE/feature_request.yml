name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What SOC or analyst problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What should SOCGenie do? Keep to what could be implemented and demonstrated
        honestly (see the honesty contract in CONTRIBUTING.md).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection rules / risk scoring
        - Machine learning
        - AI assistant
        - Alerts / incidents / investigation
        - Log ingestion
        - Analytics / reporting
        - Security / authentication
        - Documentation / developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this and open a pull request
